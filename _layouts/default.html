<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>&#128187; Diner Axel &#128187;</title>


{% seo %}
      <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
      <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->



<style>
/* === BODY & TYPOGRAPHIE === */
body {
    background-color: #f6f7fe;
    font-family: Zilla Slab, BlinkMacSystemFont, Roboto, Helvetica Neue, Helvetica, Arial, sans-serif;
    color: #011627;
    line-height: 1.5;
    margin: 0;
    padding: 0;
}

p {
    text-align: justify;
    margin: 0 0 0.5em 0; /* espace réduit sous les paragraphes */
}

li {
    margin-bottom: 0.4em; /* espace réduit entre items */
}

li strong {
    display: inline; /* évite un saut inutile après strong */
}

strong {
    color: #222;
    font-weight: 600;
    line-height: 1.2;
}

/* === TITRES & LIENS === */
h1 {
    color: #011627;
    margin-bottom: 0.3em;
}

h2, h3, h4 {
    margin-top: 1em;
    margin-bottom: 0.5em; /* réduit l’espace sous les titres */
}

h2, a, h4 {
    color: #2ec4b6;
}

h3, a:hover {
    color: #ff9f1c;
}

.fa, .fab, .fal, .far, .fas {
    color: #ff9f1c;
}

/* === BLOCQUOTES === */
blockquote {
    border-left: 1px solid #e5e5e5;
    padding-left: 1em;
    margin: 0 0 1em 0;
    color: #444;
    font-style: italic;
}

/* === CODE & PRÉ === */
code, pre {
    font-family: Monaco, Bitstream Vera Sans Mono, Lucida Console, Terminal, Consolas, Liberation Mono, DejaVu Sans Mono, Courier New, monospace;
    color: #333;
}

pre {
    background: #f8f8f8;
    border: 1px solid #e5e5e5;
    padding: 0.8em;
    overflow-x: auto;
}

/* === TABLEAUX === */
table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 1em;
}

th, td {
    border-bottom: 1px solid #e5e5e5;
    padding: 0.4em 0.6em;
    text-align: left;
}

th {
    color: #444;
}

dt {
    color: #444;
}

/* === LISTES DE TÉLÉCHARGEMENTS === */
ul.downloads {
    background: #f4f4f4;
    border: 1px solid #e0e0e0;
    padding: 0.5em;
}

.downloads li {
    border-right: 1px solid #e0e0e0;
    display: inline-block;
    padding: 0.3em 0.5em;
}

.downloads a {
    color: #676767;
    text-decoration: none;
}

.downloads a:hover {
    background-color: #f0f0f0;
}

/* === LIGNES HORIZONTALES === */
hr {
    background: #ffeacc;
    border: none;
    height: 2px;
    margin: 1em 0;
}
</style>


    
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1>Diner Axel<font color=#ff9f1c>.</font></h1>
        <p>{{ site.t[page.lang].Intro }}</p>

        <h4>
          <a href="{{ site.t[page.lang].CV.url }}">{{ site.t[page.lang].CV.name }}</a><br><br>
          <a href="#Emplois">{{ site.t[page.lang].Emploi }}</a><br>
          <a href="#Formation">{{ site.t[page.lang].Formation }}</a><br>
          <a href="#Compétences">{{ site.t[page.lang].Competence }}</a><br>
          <a href="#Certifications">{{ site.t[page.lang].Certification }}</a><br>
          <a href="#Langues">{{ site.t[page.lang].Langues }}</a><br></h4>

      </header>
      <section>

      {{ content }}

      </section>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>

  </body>
</html>
